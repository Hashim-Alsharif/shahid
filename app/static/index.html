<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>شاهد | Shahid</title>
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/app.js"></script>
</head>
<body>
  <main>
    <header>
      <div class="topbar"><span class="badge" data-i18n="badge"></span>
        <nav aria-label="Language / اللغة"><button id="lang-ar" lang="ar">العربية</button><button id="lang-en" lang="en">English</button></nav>
      </div>
      <h1 data-i18n="brand"></h1>
      <p class="lead" data-i18n="lead"></p><p data-i18n="intro"></p>
      <div class="workflow" data-i18n="workflow"></div>
      <aside id="demo-panel" class="notice" hidden>
        <p id="demo-usage" role="status"></p><p data-i18n="demoPrivacy"></p>
        <button id="logout" data-i18n="logout"></button>
      </aside>
    </header>
    <section aria-labelledby="input-title"><h2 id="input-title" data-i18n="inputTitle"></h2>
      <div class="buttons">
        <button data-example="normal" data-i18n="normal"></button>
        <button data-example="login_attempts" data-i18n="loginSample"></button>
        <button data-example="sensitive_paths" data-i18n="sensitiveSample"></button>
        <button data-example="legitimate_burst" data-i18n="burstSample"></button>
      </div>
      <label for="choose-file" data-i18n="fileLabel"></label>
      <input id="logfile" type="file" accept=".log,.txt,text/plain" hidden>
      <button id="choose-file" data-i18n="chooseFile"></button><span id="filename" class="muted filename"></span>
      <label for="logtext" data-i18n="logLabel"></label>
      <textarea id="logtext" dir="ltr" rows="8" placeholder="Nginx combined access log"></textarea>
      <p class="muted" data-i18n="localPrivacy"></p>
      <button id="analyze" class="primary" data-i18n="analyze"></button>
      <p id="message" role="status" aria-live="polite"></p>
    </section>
    <section id="results" hidden aria-labelledby="results-title">
      <h2 id="results-title" data-i18n="resultsTitle"></h2><div id="stats" class="stats"></div>
      <p class="muted" data-i18n="localOrigin"></p><div id="findings"></div>
      <div class="ai-section" aria-labelledby="ai-title">
        <span class="badge" data-i18n="optional"></span><h2 id="ai-title" data-i18n="aiTitle"></h2>
        <p data-i18n="aiIntro"></p><button id="preview" data-i18n="preview"></button>
        <div id="preview-panel" hidden>
          <p id="preview-meta" class="meta" dir="ltr"></p>
          <p class="muted" data-i18n="previewNotice"></p>
          <details open><summary data-i18n="payloadTitle"></summary><pre id="payload" dir="ltr"></pre></details>
          <label class="consent"><input id="consent" type="checkbox"><span data-i18n="consent"></span></label>
          <button id="interpret" class="primary" disabled data-i18n="interpret"></button>
          <p class="muted" data-i18n="costNotice"></p>
        </div>
        <p id="ai-message" role="status" aria-live="polite"></p>
        <div id="ai-result" hidden></div>
      </div>
      <h3 data-i18n="events"></h3><div id="evidence"></div>
      <p class="muted" data-i18n="scope"></p>
    </section>
    <footer class="muted" data-i18n="footer"></footer>
  </main>
</body>
</html>
